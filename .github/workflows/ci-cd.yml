name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_IMAGE: someshtarra/project
  GITOPS_REPO: someshtarra/GITOPS
  GITOPS_BRANCH: main

jobs:
  # STAGE 1: Build & Unit Test
  build-and-test:
    name: "Stage 1: Build & Unit Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Unit Test with Maven
        run: mvn clean verify

      - name: Upload Build Artifacts & JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: build-target
          path: target/

  # STAGE 2: SonarQube Scan
  sonarqube-scan:
    name: "Stage 2: SonarQube Scan"
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Build Target
        uses: actions/download-artifact@v4
        with:
          name: build-target
          path: target/

      - name: Run SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SECRET_SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          SONAR_URL="${SECRET_SONAR_HOST_URL:-http://35.171.244.106}"
          if [[ "$SONAR_URL" != http* ]]; then
            SONAR_URL="http://${SONAR_URL}"
          fi
          echo "Using SonarQube URL: ${SONAR_URL}"
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url="${SONAR_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  # STAGE 3: SonarQube Quality Gate
  sonarqube-quality-gate:
    name: "Stage 3: SonarQube Quality Gate"
    needs: sonarqube-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Target
        uses: actions/download-artifact@v4
        with:
          name: build-target
          path: target/

      - name: Wait for SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        with:
          scanMetadataReportFile: target/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # STAGE 4: Docker Build & Security Scan
  docker-build-and-scan:
    name: "Stage 4: Docker Build & Trivy Scan"
    needs: sonarqube-quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Target
        uses: actions/download-artifact@v4
        with:
          name: build-target
          path: target/

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.run_number }} -f Dockerfile .

      - name: Trivy Docker Image Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_IMAGE }}:${{ github.run_number }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

  # STAGE 5: Docker Push
  docker-push:
    name: "Stage 5: Docker Push"
    needs: docker-build-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Target
        uses: actions/download-artifact@v4
        with:
          name: build-target
          path: target/

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.run_number }} -f Dockerfile .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.run_number }}

  # STAGE 6: GitOps Deployment Update
  gitops-update:
    name: "Stage 6: GitOps Update"
    needs: docker-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Update Deployment Image Tag
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i "s|image:.*|image: ${{ env.DOCKER_IMAGE }}:${{ github.run_number }}|g" Deployment/deploy.yaml || true
          git add .
          git commit -m "Update image tag to ${{ github.run_number }} [skip ci]" || true
          git push origin ${{ env.GITOPS_BRANCH }}
