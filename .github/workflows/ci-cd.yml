name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_IMAGE: someshtarra/project
  GITOPS_REPO: someshtarra/GITOPS
  GITOPS_BRANCH: main

jobs:
  # STAGE 1: Build & Unit Test
  build-and-test:
    name: "Stage 1: Build & Unit Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Unit Test with Maven
        run: mvn clean verify

  # STAGE 2: Docker Build & Trivy Security Scan
  docker-build-and-scan:
    name: "Stage 2: Docker Build & Trivy Scan"
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.run_number }} -f Dockerfile .

      - name: Trivy Docker Image Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_IMAGE }}:${{ github.run_number }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

  # STAGE 3: Docker Push
  docker-push:
    name: "Stage 3: Docker Push"
    needs: docker-build-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.run_number }} -f Dockerfile .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.run_number }}

  # STAGE 4: GitOps Deployment Update
  gitops-update:
    name: "Stage 4: GitOps Update"
    needs: docker-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Update Deployment Image Tag
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i "s|image:.*|image: ${{ env.DOCKER_IMAGE }}:${{ github.run_number }}|g" Deployment/deploy.yaml || true
          git add .
          git commit -m "Update image tag to ${{ github.run_number }} [skip ci]" || true
          git push origin ${{ env.GITOPS_BRANCH }}
